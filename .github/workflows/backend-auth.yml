name: Backend Auth
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-auth.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r backend/requirements-auth.txt
          python -m pip check
      - run: python -m unittest discover -s backend -v
