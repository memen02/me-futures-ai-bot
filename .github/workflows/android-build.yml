name: Android Build

# CATATAN: workflow ini TIDAK memakai ./gradlew (gradle-wrapper.jar tidak bisa dibuat
# di lingkungan kerja Claude -- itu file biner, butuh Gradle+jaringan untuk generate).
# Sebagai gantinya, gradle/actions/setup-gradle menginstal Gradle langsung di runner.
# Ini SATU-SATUNYA cara kode Android di repo ini benar-benar diverifikasi compile --
# jalankan dan baca hasilnya di tab Actions.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests (JUnit and Robolectric)
        run: gradle test --no-daemon --stacktrace

      - name: Summarize Android unit tests
        if: always()
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import xml.etree.ElementTree as ET
          for suite in sorted(pathlib.Path("app/build/test-results").glob("test*UnitTest")):
              reports = [ET.parse(f).getroot() for f in suite.glob("TEST-*.xml")]
              totals = {k: sum(int(r.get(k, 0)) for r in reports) for k in ("tests", "failures", "errors", "skipped")}
              print(suite.name, totals)
          PYTHON

      - name: Assemble ME Project APK for offline signing
        run: |
          gradle :app:assembleReal --no-daemon
          apk=app/build/outputs/apk/real/app-real-unsigned.apk
          aapt=$(ls -dv "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/me-project-real.txt"
          grep -F "package: name='com.mefuturesaibot.app.real'" "$RUNNER_TEMP/me-project-real.txt"
          grep -Fx "application-label:'ME Project'" "$RUNNER_TEMP/me-project-real.txt"
          if grep -Fx "application-debuggable" "$RUNNER_TEMP/me-project-real.txt"; then exit 1; fi

      - name: Upload ME Project APK for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: me-project-unified-unsigned
          path: android/app/build/outputs/apk/real/app-real-unsigned.apk
          if-no-files-found: error

      - name: Assemble ME Project DEV APK
        run: |
          gradle :app:assembleDev --no-daemon
          apk=app/build/outputs/apk/dev/app-dev-unsigned.apk
          aapt=$(ls -dv "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/me-project-dev.txt"
          grep -F "package: name='com.mefuturesaibot.app.dev'" "$RUNNER_TEMP/me-project-dev.txt"
          grep -Fx "application-label:'ME Project DEV'" "$RUNNER_TEMP/me-project-dev.txt"
          if grep -Fx "application-debuggable" "$RUNNER_TEMP/me-project-dev.txt"; then exit 1; fi

      - name: Upload ME Project DEV APK
        uses: actions/upload-artifact@v4
        with:
          name: me-project-dev-unsigned
          path: android/app/build/outputs/apk/dev/app-dev-unsigned.apk
          if-no-files-found: error
