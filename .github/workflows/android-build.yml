name: Android Build

# CATATAN: workflow ini TIDAK memakai ./gradlew (gradle-wrapper.jar tidak bisa dibuat
# di lingkungan kerja Claude -- itu file biner, butuh Gradle+jaringan untuk generate).
# Sebagai gantinya, gradle/actions/setup-gradle menginstal Gradle langsung di runner.
# Ini SATU-SATUNYA cara kode Android di repo ini benar-benar diverifikasi compile --
# jalankan dan baca hasilnya di tab Actions.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests (JUnit, JVM murni -- Signer & backoff calculator)
        run: gradle test --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify packaged ME Project identity
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt=$(ls -dv "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/me-project-badging.txt"
          grep -Fx "application-label:'ME Project'" "$RUNNER_TEMP/me-project-badging.txt"
          "$aapt" dump --values resources "$apk" > "$RUNNER_TEMP/me-project-resources.txt"
          grep -F "Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" "$RUNNER_TEMP/me-project-resources.txt"
          grep -F '/ic_launcher:' "$RUNNER_TEMP/me-project-resources.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: me-project-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
